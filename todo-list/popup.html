<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaporPet Tasks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="mode-list">
<div id="app">
  <header class="top">
    <div class="logo">VAPOR<span>//</span>PET</div>
    <div class="modes" role="tablist">
      <button data-mode="list" class="on">LIST</button>
      <button data-mode="planner">PLANNER</button>
      <button data-mode="focus">FOCUS</button>
    </div>
    <button id="btnFull" class="icon" data-tip="Open in new tab (Full Screen)" aria-label="Open full screen" style="font-size:13px;">⤢</button>
    <button id="btnData" class="icon" data-tip="Import / export tasks (JSON)" aria-label="Import / export tasks">⇅</button>
  </header>

  <section id="petPanel">
    <button id="petSvg" data-tip="See your pet's parts and history" aria-label="Pet details"></button>
    <div class="petinfo">
      <div class="petname"><span id="petName"></span><span id="petMood" class="mood"></span></div>
      <div class="stage"><span id="petStage"></span></div>
      <div class="lv">LV <b id="petLv"></b> <span class="dim">· STAGE <span id="petStageNo"></span>/12</span></div>
      <div class="expbar"><div id="expFill"></div><div class="ticks"><i></i><i></i><i></i><i></i></div></div>
      <div class="exptext" id="expText"></div>
    </div>
  </section>

  <main id="listView">
    <form id="addForm" autocomplete="off">
      <input id="addInput" placeholder="New task…" maxlength="300">
      <button type="button" id="addWhere">ACTIVE</button>
      <button type="button" id="addPos">⤓</button>
      <button type="submit" class="plus" data-tip="Add task" aria-label="Add task">+</button>
    </form>
    <nav class="tabs">
      <button data-tab="active" class="on">ACTIVE <b id="cntActive">0</b></button>
      <button data-tab="backlog">BACKLOG <b id="cntBacklog">0</b></button>
      <button data-tab="done">DONE <b id="cntDone">0</b></button>
    </nav>
    <ul id="taskList"></ul>
    <div id="listFoot"></div>
  </main>

  <main id="focusView">
    <div id="focusInner"></div>
  </main>

  <main id="plannerView">
    <div id="plannerInner"></div>
  </main>

  <div id="overlay" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <div id="levelFx" hidden></div>
  <div id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">UNDO</button></div>
</div>
<script src="pet.js"></script>
<script src="popup.js"></script>
</body>
</html>
